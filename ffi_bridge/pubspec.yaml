name: ffi_bridge
description: FFI bridge to the circuitSolverLib native C++ library.
version: 0.0.1
publish_to: none

hooks:
  user_defines:
    env_file: .env

environment:
  sdk: ^3.10.7

dependencies:
  circuit_solver_proto:
    path: ../circuit_solver_proto
  code_assets: ^1.0.0
  ffi: ^2.1.3
  hooks: ^1.0.1
  logging: ^1.3.0
  native_toolchain_cmake: ^0.2.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.25.8
