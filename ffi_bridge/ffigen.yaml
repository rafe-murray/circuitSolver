# Run with `dart run ffigen --config ffigen.yaml`.
name: CircuitSolverBindings
description: |
  Bindings for the circuitSolverLib C API.

  Generated from src/ffi_bridge.h, a pure-C redeclaration of the five
  extern "C" functions in native_lib/include/circuit_solver/api.h. That
  file includes C++ headers which ffigen cannot parse; this wrapper avoids
  the issue while remaining an exact contract match.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output:
  bindings: "lib/src/circuit_solver_bindings_generated.dart"
headers:
  entry-points:
    - "../native_lib/include/circuit_solver/api.h"
ffi-native:
  asset-id: "package:ffi_bridge/ffi_bridge.dart"
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: doxygen
  length: full
