name: frontend
description: Frontend for Circuit Solver
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.0
  path: ^1.9.0
  protobuf: ^6.0.0
  ffi_bridge:
    path: ../ffi_bridge
  circuit_solver_proto:
    path: ../circuit_solver_proto
  uuid: ^4.6.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  drift_dev: ^2.21.0
  protoc_plugin: ^25.0.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true

hooks:
  user_defines:
    ffi_bridge:
      env_file: .env
