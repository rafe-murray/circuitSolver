name: frontend
description: Frontend for Circuit Solver
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.0
  path: ^1.9.0
  protobuf: ^6.0.0
  ffi_bridge:
    path: ../ffi_bridge
  circuit_solver_proto:
    path: ../circuit_solver_proto
  uuid: ^4.6.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  freezed_annotation: ^3.1.0
  diffutil_dart: ^5.0.0
  dart_mappable: ^4.8.0
  go_router: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  protoc_plugin: ^25.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  dart_mappable_builder: ^4.9.0
  go_router_builder: ^4.4.1
  build_verify: ^3.1.1

flutter:
  uses-material-design: true

hooks:
  user_defines:
    ffi_bridge:
      env_file: .env
