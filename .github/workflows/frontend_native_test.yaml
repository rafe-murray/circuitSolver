name: Frontend Integration Test

# End-to-end test of the local solve path: frontend model -> ffi_bridge ->
# native libcircuitsolver -> frontend model (frontend/test_native/).

on:
  push:
    branches: ["main"]
    paths:
      - frontend/**
      - ffi_bridge/**
      - native_lib/**
      - circuit_solver_proto/**
      - proto/**
      - .github/workflows/frontend_native_test.yaml
  pull_request:
    branches: ["main"]
    paths:
      - frontend/**
      - ffi_bridge/**
      - native_lib/**
      - circuit_solver_proto/**
      - proto/**
      - .github/workflows/frontend_native_test.yaml

env:
  FLUTTER_VERSION: "3.44.8"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('native_lib/vcpkg.json', 'native_lib/vcpkg-configuration.json') }}-llvm22
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgConfigurationJsonGlob: "**/native_lib/vcpkg-configuration.json"
          doNotCache: false

      - uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-22
          cmake: 4.4.0
          ninja: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      # ffi_bridge/hook/build.dart reads VCPKG_ROOT from this file (not the env var).
      - name: Write .env
        run: echo "VCPKG_ROOT=$VCPKG_ROOT" > frontend/.env

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run integration test
        working-directory: frontend
        run: flutter test test_native
