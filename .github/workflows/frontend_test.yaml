name: Frontend Unit Tests

on:
  push:
    branches: ["main"]
    paths:
      - frontend/**
      - .github/workflows/frontend_test.yaml
  pull_request:
    branches: ["main"]
    paths:
      - frontend/**
      - .github/workflows/frontend_test.yaml

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      # The unit suite mocks out ffi_bridge, so the native libcircuitsolver
      # build is not needed. This tells ffi_bridge/hook/build.dart to skip it.
      - name: Skip native solver build
        run: echo "SKIP_NATIVE_BUILD=1" > frontend/.env

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run tests
        working-directory: frontend
        run: flutter test test/ --coverage

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
