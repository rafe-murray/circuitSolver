name: Frontend Tests

# Builds native_lib and runs the mocked unit suite (frontend/test/) and the
# end-to-end tests (frontend/test_native/)

on:
  push:
    branches: ["main"]
    paths:
      - frontend/**
      - ffi_bridge/**
      - native_lib/**
      - circuit_solver_proto/**
      - proto/**
      - .github/workflows/frontend_test.yaml
      - .github/actions/setup-native-build/**
  pull_request:
    branches: ["main"]
    paths:
      - frontend/**
      - ffi_bridge/**
      - native_lib/**
      - circuit_solver_proto/**
      - proto/**
      - .github/workflows/frontend_test.yaml
      - .github/actions/setup-native-build/**

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-native-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          env-file-dir: frontend

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run tests
        working-directory: frontend
        run: flutter test test/ test_native/ --coverage

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
